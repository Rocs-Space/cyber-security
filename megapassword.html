<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Password Security Tool</title>
<style>
body{
  font-family: Arial, sans-serif;
  background:#0f172a;
  color:#e5e7eb;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.container{
  background:#020617;
  padding:25px;
  border-radius:10px;
  width:400px;
  box-shadow:0 0 20px rgba(0,0,0,0.5);
}

h2{
  text-align:center;
  margin-bottom:20px;
}

input{
  width:100%;
  padding:12px;
  margin-bottom:10px;
  border-radius:6px;
  border:none;
  outline:none;
  font-size:14px;
}

button{
  width:100%;
  padding:12px;
  margin-top:8px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  font-size:14px;
  background:#2563eb;
  color:white;
}

button:hover{
  background:#1d4ed8;
}

.status{
  margin-top:10px;
  font-weight:bold;
  text-align:center;
  padding:10px;
  border-radius:6px;
  display:block;
}

.strong{
  background:#052e16;
  color:#bbf7d0;
  border:1px solid #22c55e;
}

.weak{
  background:#7f1d1d;
  color:#fecaca;
  border:1px solid #ef4444;
}

#requirements{
  margin-top:8px;
  font-size:13px;
  color:#fcd34d;
  white-space: pre-line;
}
</style>
</head>
<body>
<div class="container">
<h2>Password Security</h2>

<input type="password" id="password" placeholder="Enter password">
<button type="button" id="togglePassword">Show</button>
<button onclick="generatePassword()">Generate Strong Password</button>

<div id="status" class="status weak">❌ Weak Password</div>
<div id="requirements"></div>
</div>

<script>
const passwordInput = document.getElementById("password");
const statusBox = document.getElementById("status");
const requirementsBox = document.getElementById("requirements");

// Rule settings
const MIN_UPPER = 3;  // more than 2
const MIN_NUMBER = 4; // more than 3
const MIN_SYMBOL = 4; // more than 3
const MIN_LENGTH = 12;

// Check password and show status
function checkPassword(password){
    const upperMatches = password.match(/[A-Z]/g) || [];
    const lowerMatches = password.match(/[a-z]/g) || [];
    const numberMatches = password.match(/[0-9]/g) || [];
    const symbolMatches = password.match(/[!@#$%^&*(),.?":{}|<>]/g) || [];

    const upperRule = upperMatches.length >= MIN_UPPER;
    const numberRule = numberMatches.length >= MIN_NUMBER;
    const symbolRule = symbolMatches.length >= MIN_SYMBOL;
    const lengthRule = password.length >= MIN_LENGTH;
    const lowerRule = lowerMatches.length > 0;

    if(upperRule && numberRule && symbolRule && lengthRule && lowerRule){
        statusBox.textContent = "✅ Strong Password";
        statusBox.className = "status strong";
        requirementsBox.textContent = "";
    } else {
        statusBox.textContent = "❌ Weak Password";
        statusBox.className = "status weak";

        // Show missing requirements
        let reqText = "";
        const neededUpper = Math.max(0, MIN_UPPER - upperMatches.length);
        const neededNumber = Math.max(0, MIN_NUMBER - numberMatches.length);
        const neededSymbol = Math.max(0, MIN_SYMBOL - symbolMatches.length);
        const neededLength = Math.max(0, MIN_LENGTH - password.length);
        const neededLower = lowerRule ? 0 : 1;

        if(neededUpper > 0) reqText += `• Add ${neededUpper} more uppercase letter(s)\n`;
        if(neededNumber > 0) reqText += `• Add ${neededNumber} more number(s)\n`;
        if(neededSymbol > 0) reqText += `• Add ${neededSymbol} more symbol(s)\n`;
        if(neededLower > 0) reqText += `• Add at least 1 lowercase letter\n`;
        if(neededLength > 0) reqText += `• Add ${neededLength} more character(s)\n`;

        requirementsBox.textContent = reqText;
    }
}

// Live validation as user types
passwordInput.addEventListener("input", ()=>{
    checkPassword(passwordInput.value);
});

// Show/hide password
function setupPasswordToggle(inputId, buttonId){
    const input = document.getElementById(inputId);
    const button = document.getElementById(buttonId);
    button.addEventListener("click", ()=>{
        const isHidden = input.type === "password";
        input.type = isHidden ? "text" : "password";
        button.textContent = isHidden ? "Hide" : "Show";
    });
}
setupPasswordToggle("password","togglePassword");

// Generate strong password that always meets rules
function generatePassword(){
    const upper = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    const lower = "abcdefghijklmnopqrstuvwxyz";
    const numbers = "0123456789";
    const symbols = "!@#$%^&*()_+{}[]<>?";

    let password = [];

    // Add required characters
    for(let i=0;i<MIN_UPPER;i++) password.push(upper.charAt(Math.floor(Math.random()*upper.length)));
    for(let i=0;i<MIN_NUMBER;i++) password.push(numbers.charAt(Math.floor(Math.random()*numbers.length)));
    for(let i=0;i<MIN_SYMBOL;i++) password.push(symbols.charAt(Math.floor(Math.random()*symbols.length)));

    // Fill remaining length
    const allChars = upper + lower + numbers + symbols;
    while(password.length < 16){
        password.push(allChars.charAt(Math.floor(Math.random()*allChars.length)));
    }

    // Shuffle password
    for(let i=password.length-1;i>0;i--){
        const j = Math.floor(Math.random()*(i+1));
        [password[i],password[j]]=[password[j],password[i]];
    }

    const finalPassword = password.join('');
    passwordInput.value = finalPassword;
    checkPassword(finalPassword);
}
</script>
</body>
</html>
